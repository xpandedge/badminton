name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Typecheck, Test, Rules
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build packages (domain + match-engine)
        run: pnpm --filter @picklebaddies/domain build && pnpm --filter @picklebaddies/match-engine build

      - name: Typecheck all packages
        run: pnpm -r typecheck

      - name: Unit tests
        run: pnpm -r test

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Firestore security rules tests
        run: pnpm --filter @picklebaddies/web test:rules
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks

      - name: Build functions
        run: pnpm --filter @picklebaddies/functions build

      - name: Integration tests (emulator)
        run: pnpm --filter @picklebaddies/functions test:int
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks
