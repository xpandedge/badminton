name: Deploy to Firebase

# Deploys hosting (Next.js via web frameworks), Cloud Functions, Firestore
# rules and indexes. Triggered on push to main, or manually.
#
# Prerequisites (set once in repo Settings → Secrets and variables → Actions):
#   FIREBASE_SERVICE_ACCOUNT  — JSON key for a service account with the
#                               "Firebase Admin" + "Cloud Functions Admin" +
#                               "Cloud Run Admin" + "Service Account User" roles.
#   The NEXT_PUBLIC_FIREBASE_* values are public client keys; provide them as
#   repository variables so the web build can embed them.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    environment: production

    env:
      FIREBASE_CLI_EXPERIMENTS: webframeworks
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ vars.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }}
      NEXT_PUBLIC_USE_EMULATORS: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Unit tests
        run: pnpm -r test

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Authenticate to Google Cloud
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      - name: Set up Artifact Registry cleanup policy
        # Requires `Artifact Registry Admin` role on the service account.
        # Runs before deploy so a missing-permissions failure here doesn't mask deploy errors.
        # Safe to re-run; idempotent.
        run: firebase functions:artifacts:setpolicy --project picklebaddies-prod-e727d --force || true

      - name: Deploy (hosting + functions + rules + indexes)
        run: firebase deploy --only hosting,functions,firestore --project picklebaddies-prod-e727d --non-interactive --force
