name: Deploy to Firebase

# Deploys hosting (Next.js via web frameworks), Cloud Functions, Firestore
# rules and indexes. Triggered on push to main, or manually.
#
# Prerequisites (set once in repo Settings → Secrets and variables → Actions):
#   FIREBASE_SERVICE_ACCOUNT  — JSON key for a service account with the
#                               "Firebase Admin" + "Cloud Functions Admin" +
#                               "Cloud Run Admin" + "Service Account User" roles.
#   The NEXT_PUBLIC_FIREBASE_* values are public client keys; provide them as
#   repository variables so the web build can embed them.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    environment: production

    env:
      FIREBASE_CLI_EXPERIMENTS: webframeworks
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ vars.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }}
      NEXT_PUBLIC_USE_EMULATORS: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Unit tests
        run: pnpm -r test

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          create_credentials_file: true
          export_environment_variables: true

      - name: Configure production Firebase runtime
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          test -n "$FIREBASE_SERVICE_ACCOUNT"
          node <<'NODE'
          const fs = require("node:fs");
          const account = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT);
          if (!account.client_email || !account.private_key) {
            throw new Error("FIREBASE_SERVICE_ACCOUNT is missing client_email or private_key");
          }
          const privateKey = account.private_key.replace(/\r?\n/g, "\\n");
          fs.writeFileSync(
            "apps/web/.env.picklebaddies-prod-e727d",
            [
              "FIREBASE_ADMIN_PROJECT_ID=picklebaddies-prod-e727d",
              `FIREBASE_ADMIN_CLIENT_EMAIL=${account.client_email}`,
              `FIREBASE_ADMIN_PRIVATE_KEY=${privateKey}`,
              "",
            ].join("\n"),
          );
          NODE

      - name: Verify production Firebase configuration
        run: |
          test "$NEXT_PUBLIC_FIREBASE_PROJECT_ID" = "picklebaddies-prod-e727d"
          test -n "$NEXT_PUBLIC_FIREBASE_API_KEY"
          test -n "$NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN"
          test -n "$NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET"
          test -n "$NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID"
          test -n "$NEXT_PUBLIC_FIREBASE_APP_ID"

      - name: Set up Artifact Registry cleanup policy
        # Requires `Artifact Registry Admin` role on the service account.
        # Runs before deploy so a missing-permissions failure here doesn't mask deploy errors.
        # Safe to re-run; idempotent.
        run: firebase functions:artifacts:setpolicy --project picklebaddies-prod-e727d --force || true

      # Split from functions on purpose. Functions deploys have been failing
      # since the move to the prod project, and a combined deploy meant the web
      # app and rules could not ship either. Hosting and Firestore carry all the
      # user-facing work, so they go first and must succeed.
      - name: Deploy hosting + rules + indexes
        run: firebase deploy --only hosting,firestore --project picklebaddies-prod-e727d --non-interactive --force

      # Functions are reference-only for the MVP (DELTA_SPEC D8) apart from the
      # join/invite callables. Allowed to fail so a functions problem never
      # blocks the web app again — the step still shows red so it is not hidden.
      - name: Deploy functions
        continue-on-error: true
        run: firebase deploy --only functions --project picklebaddies-prod-e727d --non-interactive --force
